name: Build & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push multi-arch image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.pick_tag.outputs.version_tag }}
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算小写化的 owner（ghcr.io 命名空间必须全小写）
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: "Docker meta (tags: latest / vX.Y.Z / semver)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner_lc }}/clipsync-server
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 决定部署用的镜像 tag（tag=版本号，手动触发=latest）
        id: pick_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version_tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 从 git ref 提取版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "::notice::APP_VERSION=$VER"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: docker
    # tag 推送或手动触发才部署
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 部署到远程服务器（拉镜像 + 重启容器）
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            IMAGE_TAG="${{ needs.docker.outputs.image_tag }}"
            GHCR_USER="${{ github.actor }}"
            GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"

            echo "==> 登录 GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> 进入部署目录 /app/ClipSync/server"
            cd /app/ClipSync/server

            echo "==> 写入本次部署镜像 tag（docker-compose 读取 .env）"
            touch .env
            sed -i '/^IMAGE_TAG=/d' .env || true
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env

            echo "==> 确保 config/config.yaml 监听端口为 28001"
            if [ -f config/config.yaml ]; then
              if grep -qE '^\s*addr:\s*":8080"' config/config.yaml; then
                sed -i -E 's|^(\s*addr:\s*)":8080"|\1":28001"|' config/config.yaml
                echo "已将 server.addr 从 :8080 改为 :28001"
              elif grep -qE '^\s*addr:\s*":28001"' config/config.yaml; then
                echo "server.addr 已是 :28001，无需修改"
              else
                echo "⚠️ config/config.yaml 中未找到 :8080/:28001 形式的 server.addr，请手动确认监听端口"
              fi
            else
              echo "⚠️ 未找到 config/config.yaml，容器将使用内置默认端口 :28001"
            fi

            echo "==> 拉取镜像 ghcr.io/${{ needs.docker.outputs.owner_lc }}/clipsync-server:$IMAGE_TAG"
            docker compose pull clipsync

            echo "==> 重建并启动容器"
            docker compose up -d --remove-orphans

            echo "==> 清理悬空镜像"
            docker image prune -f || true

            echo "==> 当前容器状态"
            docker compose ps
