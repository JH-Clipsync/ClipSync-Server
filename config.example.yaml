# ClipSync-Server 配置文件示例
# 拷贝为 config.yaml 后按需修改；任何未填写的字段都使用代码里的默认值。
# 也可通过环境变量覆盖关键字段（优先级：环境变量 > 配置文件 > 默认值）。

server:
  # 监听地址，":8080" 表示监听所有网卡；放容器里时通常配 0.0.0.0:8080
  addr: ":8080"
  # HTTP 读/写超时（支持 Go 标准 duration 字符串，如 "15s" / "1m"）
  read_timeout: 15s
  write_timeout: 15s
  # 优雅退出等待时间：收到 SIGTERM 后多久强制退出
  shutdown_timeout: 10s
  # 是否信任反代头。true 时会用 X-Forwarded-For / X-Real-IP 取真实 IP
  # （反代在前面时务必开启，否则 IP 日志全是 127.0.0.1）
  trust_proxy: false

logs:
  # 日志根目录；容器里通常配 /data/logs，再挂载到宿主机
  dir: "logs"
  # 日志级别：debug / info / warn / error（目前只作展示，后续会接入分级）
  level: "info"
  # 归档日志保留天数（0 = 不清理）
  max_age_days: 0
  # 是否同时把日志输出到 stdout（容器部署建议 true，便于 docker logs / kubectl logs）
  stdout: true

websocket:
  # 单条消息最大字节（剪贴板图片可能很大；10MB = 10485760）
  read_limit: 10485760
  # 读超时（秒），60 之内没收到数据就断开
  read_deadline_sec: 60
  # 单条消息写超时（秒）
  write_deadline_sec: 10
  # 心跳间隔（秒）
  ping_interval_sec: 30
  # 每客户端的发送队列长度；满了就丢弃并打 warning
  send_queue_size: 32

message_protocol:
  # 是否允许任意 Origin 跨域 WebSocket（true = 全放行；生产建议 false 改走白名单）
  check_origin: true
  # payload 预览最大字符数（只影响日志展示，不影响协议）
  max_payload_preview: 40

# ===== 环境变量覆盖（任选其一即可，无需改文件） =====
# CLIPSYNC_ADDR            覆盖 server.addr
# CLIPSYNC_LOG_DIR         覆盖 logs.dir
# CLIPSYNC_LOG_LEVEL       覆盖 logs.level
# CLIPSYNC_TRUST_PROXY     覆盖 server.trust_proxy（true/false）
# CLIPSYNC_WS_READ_LIMIT   覆盖 websocket.read_limit（字节）
