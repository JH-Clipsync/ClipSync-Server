# ClipSync 部署编排
#
# name 决定 Docker Desktop 里的分组名：mysql / redis / clipsync 会挂在
# 「clipsync」这一组下面，而不是按目录名随机分组。
#
# ===== 开发：只起依赖，server 自己在宿主机跑 =====
#   cp .env.example .env      # 改掉里面所有密码
#   docker compose up -d      # 默认只起 mysql + redis
#   docker compose ps         # 等 mysql 变成 healthy
#
#   然后自己起 server（把密码换成 .env 里的 MYSQL_PASSWORD）：
#     export CLIPSYNC_MYSQL_PASSWORD=<你的 MYSQL_PASSWORD>
#     export CLIPSYNC_BOOTSTRAP_USER=admin
#     export CLIPSYNC_BOOTSTRAP_PASSWORD=<初始密码，至少 8 位>
#     go run .
#   代码默认就连 127.0.0.1:3306 / 127.0.0.1:6379，主机和端口无需再设。
#   若 .env 里改了 MYSQL_HOST_PORT / REDIS_HOST_PORT，对应设置
#   CLIPSYNC_MYSQL_PORT / CLIPSYNC_REDIS_ADDR 即可。
#
# ===== 生产：三件套一起起 =====
#   mkdir -p config logs && cp config.example.yaml config/config.yaml
#   docker compose --profile server up -d --build
#   docker compose logs -f clipsync
#
# 起来之后先登录拿 token：
#   curl -X POST http://localhost:8080/auth/login \
#     -H 'Content-Type: application/json' \
#     -d '{"username":"admin","password":"<你的 BOOTSTRAP_PASSWORD>"}'

name: clipsync

services:
  clipsync:
    # server 归到 server profile：默认 up 不会启动它，
    # 只有显式 --profile server 时才参与编排。
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile
    image: gitwangjiahui/clipsync-server:latest
    container_name: clipsync-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # 配置文件：宿主机的 ./config/config.yaml 映射到容器的 /data/config/config.yaml
      - ./config:/data/config:ro
      # 日志持久化：容器内 /data/logs → 宿主机 ./logs
      - ./logs:/data/logs
    environment:
      # 以下任一环境变量都可覆盖 config.yaml 里的同名配置
      - TZ=Asia/Shanghai
      # 反代在前面时务必开 trust_proxy
      - CLIPSYNC_TRUST_PROXY=true
      # 也可直接改端口（同时记得把上面 ports 一起改）
      # - CLIPSYNC_ADDR=:8080

      # ===== 存储：走 compose 内部网络，主机名就是服务名 =====
      - CLIPSYNC_MYSQL_HOST=mysql
      - CLIPSYNC_MYSQL_PORT=3306
      - CLIPSYNC_MYSQL_USER=${MYSQL_USER:-clipsync}
      - CLIPSYNC_MYSQL_PASSWORD=${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
      - CLIPSYNC_MYSQL_DATABASE=${MYSQL_DATABASE:-clipsync}
      - CLIPSYNC_REDIS_ADDR=redis:6379
      - CLIPSYNC_REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # ===== 认证 =====
      # token 有效期（小时），默认 30 天
      - CLIPSYNC_TOKEN_TTL_HOURS=${TOKEN_TTL_HOURS:-720}
      # 部署完建议改成 false，避免陌生人注册
      - CLIPSYNC_ALLOW_REGISTER=${ALLOW_REGISTER:-true}
      # 首次启动自动创建的账号（已存在则跳过）
      - CLIPSYNC_BOOTSTRAP_USER=${BOOTSTRAP_USER:-admin}
      - CLIPSYNC_BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD:?请在 .env 里设置 BOOTSTRAP_PASSWORD}

      # ===== 端到端加密 =====
      # 三端都升级到支持加密的版本后改成 true，服务端会拒绝一切明文消息
      - CLIPSYNC_E2EE_REQUIRE=${E2EE_REQUIRE:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    container_name: clipsync-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-clipsync}
      - MYSQL_USER=${MYSQL_USER:-clipsync}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动建库建表
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 映射到宿主机，方便在容器外自己起 server 或用客户端连库。
      # 只想让 compose 内部访问（更安全）就把这段注掉。
      - "${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: clipsync-redis
    restart: unless-stopped
    # REDIS_PASSWORD 为空时不启用密码（仅内部网络可达）
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else exec redis-server --appendonly yes; fi'
    environment:
      - TZ=Asia/Shanghai
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      # 同 mysql：暴露给宿主机的 server 进程用
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 可选：内置反代（Caddy）走 443 自动 HTTPS，前提是你有公网域名
  # 取消下面的注释并填好域名即可启动
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: clipsync-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - clipsync

volumes:
  mysql_data:
  redis_data:
  # caddy_data:
  # caddy_config:
