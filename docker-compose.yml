# ClipSync 部署编排（连接宿主机已有的 Redis/MySQL 容器）
#
# 前提：服务器上已经有 Redis 和 MySQL 容器在跑（或宿主机原生服务）
#   - Redis 暴露在 5000 端口（映射容器的 6379）
#   - MySQL 暴露在 3306 端口
#
# 直接启动（不会另起 MySQL/Redis）：
#   mkdir -p config logs
#   cp deploy/config.external.yaml config/config.yaml
#   # 修改 config.yaml 里的密码等
#   docker compose up -d
#   docker compose logs -f clipsync

name: clipsync

services:
  clipsync:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jh-clipsync/clipsync-server:latest
    container_name: clipsync-server
    restart: unless-stopped
    # 使用 host 网络，直接访问宿主机的 Redis/MySQL
    network_mode: host
    # distroless nonroot 镜像默认 uid 65532，对宿主机 ./logs 没写权限；
    # 直接以 root 运行，省去宿主机 chmod 的麻烦
    user: "0:0"
    # host 网络下 ports 映射不需要（直接绑定宿主机端口）
    # 如果端口冲突，修改 config.yaml 里的 server.addr 即可
    volumes:
      - ./config:/data/config:ro
      - ./logs:/data/logs
    environment:
      - TZ=Asia/Shanghai
      - CLIPSYNC_TRUST_PROXY=true
      - CLIPSYNC_TOKEN_TTL_HOURS=${TOKEN_TTL_HOURS:-720}
      - CLIPSYNC_ALLOW_REGISTER=${ALLOW_REGISTER:-true}
      - CLIPSYNC_BOOTSTRAP_USER=${BOOTSTRAP_USER:-admin}
      - CLIPSYNC_BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD:?请在 .env 里设置 BOOTSTRAP_PASSWORD}
      - CLIPSYNC_E2EE_REQUIRE=${E2EE_REQUIRE:-false}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
